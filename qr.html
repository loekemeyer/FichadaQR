<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pantalla de fichada - QR rotativo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="qr-page">
    <main class="qr-stage">
      <h1 class="qr-title">Fichada Esnaola</h1>
      <p class="qr-sub">Escanea el QR con tu celular</p>

      <div class="qr-frame" id="qr-frame">
        <canvas id="qr-canvas" width="320" height="320" aria-label="Codigo QR de fichada"></canvas>
      </div>

      <div class="qr-meta">
        <div class="qr-bar">
          <div class="qr-bar__fill" id="qr-bar-fill"></div>
        </div>
        <div class="qr-countdown">
          Proximo codigo en <strong id="qr-secs">--</strong> s
        </div>
      </div>

      <p class="qr-warn" id="qr-warn" hidden></p>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="config.js"></script>
    <script src="totp.js"></script>
    <script src="qr.js"></script>
  </body>
</html>
